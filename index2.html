<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu ❤️</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    overflow-x: hidden;
}

/* LOVE TEXT */
@keyframes glow {
    0% { transform: scale(1); text-shadow: 0 0 10px #fff; }
    50% { transform: scale(1.1); text-shadow: 0 0 25px #ff4da6; }
    100% { transform: scale(1); text-shadow: 0 0 10px #fff; }
}

.love-text {
    animation: glow 2s infinite;
}

/* FALL ANIMATION */
@keyframes fall {
    to {
        transform: translateY(110vh);
        opacity: 0;
    }
}

/* NIGHT BACKGROUND */
.bg-layer {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;

    background: linear-gradient(180deg,
        #050510 0%,
        #0b0b22 40%,
        #1a103d 75%,
        #2a1b4a 100%
    );
}

/* STAR */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; transform: scale(1); }
    to { opacity: 1; transform: scale(1.6); }
}

/* CLOUD */
.cloud {
    position: absolute;
    width: 120px;
    opacity: 0.2;
    filter: blur(1px);
}

/* PLANET */
.planet {
    position: absolute;
    width: 80px;
    animation: floatPlanet 10s ease-in-out infinite;
}

@keyframes floatPlanet {
    0% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-25px) rotate(180deg); }
    100% { transform: translateY(0px) rotate(360deg); }
}

/* BUTTON */
.btn {
    transition: 0.3s;
}
.btn:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg-layer">

    <!-- MOON -->
    <div style="
        position:absolute;
        top:10%;
        right:10%;
        width:120px;
        height:120px;
        background: radial-gradient(circle, #fff, #ffd6ff, transparent 70%);
        border-radius:50%;
        opacity:0.7;
        filter: blur(2px);
    "></div>

    <!-- STARS -->
    <div class="star" style="top:10%; left:20%;"></div>
    <div class="star" style="top:20%; left:80%;"></div>
    <div class="star" style="top:35%; left:50%;"></div>
    <div class="star" style="top:60%; left:30%;"></div>
    <div class="star" style="top:75%; left:85%;"></div>
    <div class="star" style="top:50%; left:10%;"></div>
    <div class="star" style="top:15%; left:60%;"></div>

    <!-- CLOUD -->
    <img src="https://pngimg.com/uploads/cloud/cloud_PNG16.png"
         class="cloud" style="top:20%; left:10%;">

    <img src="https://pngimg.com/uploads/cloud/cloud_PNG17.png"
         class="cloud" style="top:60%; left:50%;">

    <!-- PLANET -->
    <img src="https://pngimg.com/uploads/earth/earth_PNG39.png"
         class="planet" style="top:25%; left:10%;">

    <img src="https://pngimg.com/uploads/moon/moon_PNG37.png"
         class="planet" style="top:65%; left:75%;">

</div>

<!-- CONTENT -->
<div class="max-w-6xl mx-auto mt-16 px-6 text-center relative z-10">

    <h1 class="text-5xl font-bold italic text-pink-200 mb-6 drop-shadow-lg">
        Untuk Safana Nurlies Maharani Kamu ❤️
    </h1>

    <div class="mx-auto w-[280px] overflow-hidden rounded-[30px] shadow-2xl">
        <img src="ayang nana.jpeg"
             class="w-full h-[250px] object-cover object-top hover:scale-105 transition duration-300">
    </div>

    <!-- I LOVE YOU BOX -->
    <div class="max-w-4xl mx-auto mt-8 bg-gradient-to-r from-indigo-950 via-purple-900 to-pink-900 text-white p-10 rounded-3xl shadow-2xl border border-pink-300/40 backdrop-blur-md">

        <h2 class="love-text text-4xl md:text-6xl font-extrabold">
            I LOVE YOU SAYANGGG ❤️
        </h2>

    </div>

    <p class="text-sm text-purple-200 mt-6 opacity-80">
        @by: Robil Muhammad Darwis
    </p>

    <a href="index.html"
       class="btn inline-block mt-8 bg-gray-800 hover:bg-gray-900 text-white px-6 py-3 rounded-xl shadow-lg">
       Back
    </a>

</div>

<!-- EMOJI + HEART FALL -->
<script>

const emojis = ["❤️","💖","✨","💫","🥺","💕"];

setInterval(() => {

    const el = document.createElement("div");

    el.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];

    el.style.position = "fixed";
    el.style.left = Math.random() * 100 + "vw";
    el.style.top = "-20px";
    el.style.fontSize = "22px";
    el.style.zIndex = "9999";
    el.style.animation = "fall 6s linear";

    document.body.appendChild(el);

    setTimeout(() => el.remove(), 6000);

}, 500);

</script>

</body>
</html>
