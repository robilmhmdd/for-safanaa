<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-100">

    <div class="max-w-6xl mx-auto mt-16 px-6">
        
        <div class="grid md:grid-cols-2 gap-10 items-center">

            <div>
                <h1 class="text-5xl font-bold italic text-pink-500 mb-6">
                    Hai Sayang ❤️
                </h1>

                <p class="text-gray-700 leading-7 mb-6 text-justify">
                    …siapin hati kamu ya 😊
                    Karena ini bukan cuma sekadar kata-kata, 
                    tapi sesuatu yang aku siapin khusus buat kamu 😏
                </p>

                <a href="index2.html"
                   class="bg-pink-500 hover:bg-pink-600 text-white px-6 py-3 rounded-lg shadow-md transition">
                   Buka Pesan 💌
                </a>
            </div>

            <div class="mx-auto w-[280px] overflow-hidden rounded-[30px] shadow-xl">
                <img src="ayang nana.jpeg"
                     class="w-full h-[250px] object-cover object-top hover:scale-105 transition duration-300">
            </div>

        </div>

    </div>

    <script>
setInterval(() => {

    const heart = document.createElement("div");

    heart.innerHTML = "❤️";

    heart.style.position = "fixed";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = "-20px";
    heart.style.fontSize = "25px";
    heart.style.zIndex = "9999";
    heart.style.animation = "fall 5s linear";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);

}, 400);
</script>

<style>
@keyframes fall {
    to {
        transform: translateY(110vh);
        opacity: 0;
    }
}
</style>

</body>
</html>
